<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GrowthOS Live Event Inspector</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="badge">GrowthOS</span>
      <h2>Behavior Intelligence QA Panel</h2>
    </div>
    <div class="actions">
      <input type="text" id="searchInput" placeholder="Filter by event name or property...">
      <select id="categoryFilter">
        <option value="all">All Events</option>
        <option value="page">Page & Lifecycle</option>
        <option value="element">Autocapture & DOM</option>
        <option value="form">Forms</option>
        <option value="user">UX Friction (Rage/Dead/Exit)</option>
        <option value="commerce">E-Commerce & Funnels</option>
      </select>
      <button id="clearBtn" class="btn">Clear</button>
      <button id="exportBtn" class="btn btn-primary">Export JSON</button>
    </div>
  </div>

  <div class="meta-bar">
    <div class="meta-item"><strong>Session ID:</strong> <span id="metaSession">-</span></div>
    <div class="meta-item"><strong>Distinct / Anon ID:</strong> <span id="metaAnon">-</span></div>
    <div class="meta-item"><strong>Customer ID:</strong> <span id="metaCustomer">-</span></div>
    <div class="meta-item"><strong>Events Ingested:</strong> <span id="metaCount" class="highlight">0</span></div>
  </div>

  <div class="container">
    <div class="event-list" id="eventList">
      <div class="empty-state">Waiting for GrowthOS events to fire...</div>
    </div>
    <div class="event-details" id="eventDetails">
      <div class="empty-state">Select an event from the left to inspect its payload & properties.</div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
