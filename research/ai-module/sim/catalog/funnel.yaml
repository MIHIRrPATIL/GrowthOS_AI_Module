    payment_to_order: 0.94
  fashion:
    view_to_cart: 0.12
    cart_to_checkout: 0.55
    checkout_to_payment: 0.78
    payment_to_order: 0.89
  electronics:
    view_to_cart: 0.08
    cart_to_checkout: 0.45
    checkout_to_payment: 0.75
    payment_to_order: 0.92
  grocery:
    view_to_cart: 0.45
    cart_to_checkout: 0.80
    checkout_to_payment: 0.92
    payment_to_order: 0.96
  d2c_subscription:
    view_to_cart: 0.18
    cart_to_checkout: 0.60
    checkout_to_payment: 0.82
    payment_to_order: 0.91

friction_rates:
  rage_click_rate_mobile: 0.04
  rage_click_rate_desktop: 0.015
