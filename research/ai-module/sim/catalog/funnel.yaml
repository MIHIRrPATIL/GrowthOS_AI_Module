version: "v1"
description: "E-Commerce Funnel conversion parameters and step transitions"

funnel_steps:
  - id: "step_1_view"
    name: "Product & Menu Views"
  - id: "step_2_cart"
    name: "Add to Cart"
  - id: "step_3_checkout"
    name: "Initiate Checkout"
  - id: "step_4_payment"
    name: "Payment Gateway"
  - id: "step_5_order"
    name: "Order Completed"

