<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GrowthOS Test Harness</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    .section { margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .long-content { height: 2500px; background: linear-gradient(to bottom, #f0fdf4, #eff6ff, #fdf2f8); padding: 20px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
    input { padding: 6px 10px; margin: 4px 0; display: block; width: 300px; }
  </style>
</head>
<body>
  <h1>GrowthOS SDK Test Environment</h1>

  <div class="section" id="authSection">
    <h2>Identity & Sessions</h2>
    <button id="btnIdentify">Identify User (CUST-48291)</button>
    <button id="btnReset">Reset / Logout</button>
  </div>

  <div class="section" id="ecommerceSection">
    <h2>E-Commerce Flow</h2>
    <button id="btnViewProduct">1. View Product (Farmhouse Pizza)</button>
    <button id="btnAddToCart">2. Add to Cart</button>
    <button id="btnStartCheckout">3. Start Checkout</button>
    <button id="btnStep2">4. Complete Step 2 (Address)</button>
    <button id="btnAbandonCheckout">5. Abandon Checkout</button>
    <button id="btnCompletePurchase">6. Purchase Completed</button>
  </div>

  <div class="section" id="formSection">
    <h2>Form Intelligence & PII Masking</h2>
    <form id="signupForm">
      <label>Full Name: <input type="text" id="nameInput" name="user_name" placeholder="John Doe"></label>
      <label>Email: <input type="email" id="emailInput" name="user_email" placeholder="john@example.com"></label>
      <label>Password (Auto-masked): <input type="password" id="passwordInput" name="password" value="SuperSecret123!"></label>
      <label>Credit Card (Auto-masked): <input type="text" id="cardInput" name="card_number" value="4111 1111 1111 1111"></label>
      <label>Custom Masked Field: <input type="text" id="maskedInput" data-growthos-mask="true" value="ConfidentialData"></label>
      <button type="submit" id="btnSubmitForm">Submit Form</button>
    </form>
  </div>

  <div class="section" id="uxSection">
    <h2>UX Friction Targets</h2>
    <button id="btnRageClick">Rage Click Target (Click fast 3+ times)</button>
    <div id="deadClickDiv" style="display:inline-block; padding:10px; background:#eee; cursor:default;">
      Non-interactive Dead Click Area
    </div>
  </div>

  <div class="section">
    <h2>Scroll Depth Test Zone</h2>
    <div class="long-content">
      <p>Scroll down to trigger milestones (25%, 50%, 75%, 90%, 100%)...</p>
    </div>
  </div>

  <script src="../sdk/dist/growthos.min.js"></script>
  <script>
    window.__capturedEvents = [];

    // Register listener before init or directly on GrowthOS
    GrowthOS.addListener(function(envelope) {
      window.__capturedEvents.push({
        name: envelope.event_name,
        props: envelope.properties,
        timestamp: envelope.timestamp,
        anon_id: envelope.anonymous_id,
        cust_id: envelope.customer_id,
        session_id: envelope.session_id,
        envelope: envelope
      });
    });

    // Initialize GrowthOS SDK with debug enabled
    GrowthOS.init({
      projectId: "proj_test_growthos",
      workspaceId: "ws_test",
      apiHost: "http://localhost:8000",
      usePosthog: false, // Testing core HTTP & capture engine
      debug: true,
      consent: {
        analytics: true,
        marketing: true,
        sessionReplay: true,
        required: false
      }
    });

    // Attach button click handlers for canonical e-commerce sequence
    document.getElementById('btnIdentify').addEventListener('click', () => {
      GrowthOS.identify('CUST-48291', { name: 'John Doe', tier: 'Gold' });
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      GrowthOS.reset();
    });

    document.getElementById('btnViewProduct').addEventListener('click', () => {
      GrowthOS.track('product.viewed', {
        product_id: 'PRD-PIZZA-FARMHOUSE',
        name: 'Farmhouse Pizza',
        price: 459.00,
        currency: 'INR'
      });
    });

    document.getElementById('btnAddToCart').addEventListener('click', () => {
      GrowthOS.track('cart.item_added', {
        cart_id: 'cart_9921',
        product_id: 'PRD-PIZZA-FARMHOUSE',
        name: 'Farmhouse Pizza',
        price: 459.00,
        quantity: 2
      });
    });

    document.getElementById('btnStartCheckout').addEventListener('click', () => {
      GrowthOS.track('checkout.started', {
        checkout_id: 'chk_10293',
        cart_id: 'cart_9921',
        cart_value: 918.00
      });
    });

    document.getElementById('btnStep2').addEventListener('click', () => {
      GrowthOS.track('checkout.step_completed', {
        checkout_id: 'chk_10293',
        step_number: 2,
        step_name: 'delivery_address'
      });
    });

    document.getElementById('btnAbandonCheckout').addEventListener('click', () => {
      GrowthOS.track('checkout.abandoned', {
        checkout_id: 'chk_10293',
        step_abandoned_at: 2,
        cart_value: 918.00
      });
    });

    document.getElementById('btnCompletePurchase').addEventListener('click', () => {
      GrowthOS.track('purchase.completed', {
        order_id: 'ORD-2026-9481',
        checkout_id: 'chk_10293',
        total: 978.00,
        currency: 'INR'
      });
    });

    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
